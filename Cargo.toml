[package]
name = "lofi"
version = "0.1.0"
edition = "2024"
description = "A lo-fi radio for your terminal"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
rodio = { version = "0.19", default-features = false }
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
unicode-width = "0.2"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[profile.release]
lto = "thin"
strip = true
